# Construit l'extracteur pour Linux et Windows, et l'attache a la release.
#
# Pourquoi il existe : sans lui, l'utilisateur doit installer wow.export, filtrer,
# exporter 82 Mo d'images, puis lancer deux commandes. Avec lui, il decompresse et
# lance UN programme qui lit sa propre copie du jeu.
#
# Ce qui est publie : le CODE de l'extracteur, compile. Jamais une tuile. Les
# images restent chez celui qui possede le jeu — c'est toute la difference entre
# fournir un outil et redistribuer des assets.
#
# CascLib est sous licence MIT (Ladislav Zezula), donc redistribuable, y compris
# compile. Sa licence part avec le binaire.

name: build-extractor

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nom: mapenh-extract-linux-x86_64
          - os: windows-latest
            nom: mapenh-extract-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    # Sans ca, `gh release upload` rend HTTP 403 : le jeton par defaut est en
    # lecture seule sur les contenus depuis 2023.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer CascLib
        uses: actions/checkout@v4
        with:
          repository: ladislav-zezula/CascLib
          path: CascLib
          ref: master

      - name: Construire CascLib
        # `shell: bash` est indispensable : sans lui, Windows execute du
        # PowerShell, ou `\` en fin de ligne n'est pas une continuation. La
        # commande partait tronquee et cmake ne voyait jamais ses options.
        shell: bash
        run: |
          # CascLib declare `cmake_minimum_required(VERSION 2.8)`, que CMake 4
          # refuse desormais. On lui dit d'appliquer les regles de 3.5 plutot que
          # de modifier une dependance qui ne nous appartient pas.
          cmake -S CascLib -B CascLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCASC_BUILD_STATIC_LIB=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build CascLib/build --config Release

      # Deux etapes plutot qu'un `if` dans le script : sur Windows, `cl` n'existe
      # pas dans le bash de Git for Windows (exit 127), il faut l'environnement
      # MSVC et le shell cmd.
      - name: Préparer MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Construire l'extracteur (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          lib=$(find CascLib/build -name "libcasc.a" -o -name "*casc*.a" | head -1)
          echo "CascLib : $lib"
          cc -O2 -I CascLib/src tools/src/mapenh-extract.c "$lib" -lstdc++ -lz -o ${{ matrix.nom }}

      - name: Construire l'extracteur (Windows)
        if: runner.os == 'Windows'
        # On CHERCHE la bibliotheque au lieu d'ecrire son nom : le premier jet
        # visait `casc.lib`, elle s'appelle `CascLib.lib`, et le lieur rendait
        # LNK1104 sans dire lequel des deux noms il avait essaye.
        shell: bash
        run: |
          lib=$(find CascLib/build -iname "*casc*.lib" | head -1)
          echo "CascLib : $lib"
          test -n "$lib"
          cl //std:c11 //O2 //I CascLib/src tools/src/mapenh-extract.c \
             "$(cygpath -w "$lib")" //link //OUT:${{ matrix.nom }}

      - name: Vérifier qu'il démarre
        shell: bash
        run: |
          # Lance sans argument : il doit afficher son usage et sortir. Un binaire
          # qui se construit mais ne demarre pas n'est pas un binaire livrable.
          ./${{ matrix.nom }} 2>&1 | head -2 || true
          test -s ${{ matrix.nom }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: ${{ matrix.nom }}

      - name: Attacher à la release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload ${{ github.event.release.tag_name }} ${{ matrix.nom }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
